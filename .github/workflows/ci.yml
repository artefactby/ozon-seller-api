name: CI

on:
  push:
    # api-sync/** is covered by push, not pull_request: the sync PR is opened
    # by a workflow with GITHUB_TOKEN, and such PRs do not fire pull_request
    # events. Status checks land on the same SHA and show up in the PR anyway.
    branches: [main, 'api-sync/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The dev toolchain (vitest 4 / vite 7) needs Node >= 20.19.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # The package claims Node >= 18 (native fetch), which the dev toolchain can no
  # longer run on. Build with a modern Node, then execute the built output on 18
  # with a dependency-free smoke script.
  runtime-node18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v5
        with:
          node-version: 18
      - run: node --version
      - run: node scripts/runtime-smoke.mjs
